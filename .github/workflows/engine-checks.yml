name: Engine checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core regression dependencies
        run: |
          python -m pip install numpy scipy opencv-contrib-python-headless scenedetect==0.7.1 yt-dlp
          python -m pip install --no-deps -e engine
      - name: Compile engine sources
        run: python -m compileall -q engine/crosscut engine/crosscut2 engine/crosscut_cli.py
      - name: Run core regression tests
        run: |
          python -m unittest -q \
            engine.tests.test_audio \
            engine.tests.test_request \
            engine.tests.test_timeline \
            engine.tests.test_visual_score \
            engine.tests.test_render \
            engine.tests.test_render_frame_schedule \
            engine.tests.test_boundary_affine_match
