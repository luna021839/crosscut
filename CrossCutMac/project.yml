name: CrossCutMac

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES

targets:
  CrossCutMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.luna021839.crosscut
        PRODUCT_NAME: CrossCutMac
        PRODUCT_MODULE_NAME: CrossCutMac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CrossCut"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          COPY_PHASE_STRIP: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
    postBuildScripts:
      - name: Bundle Python Engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          engine_source="${SRCROOT}/../engine"
          engine_destination="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/engine"

          case "${engine_destination}" in
            "${TARGET_BUILD_DIR}/"*) ;;
            *) echo "Refusing to clean unexpected engine destination: ${engine_destination}" >&2; exit 1 ;;
          esac

          test -f "${engine_source}/crosscut_cli.py"
          test -f "${engine_source}/crosscut/__init__.py"
          test -f "${engine_source}/crosscut/models/face_detection_yunet_2023mar.onnx"
          test -f "${engine_source}/crosscut/models/LICENSE.yunet"
          test -f "${engine_source}/crosscut/models/face_recognition_sface_2021dec.onnx"
          test -f "${engine_source}/crosscut/models/LICENSE.opencv-zoo-sface"
          test -f "${engine_source}/crosscut/models/person_detection_mediapipe_2023mar.onnx"
          test -f "${engine_source}/crosscut/models/pose_estimation_mediapipe_2023mar.onnx"
          test -f "${engine_source}/crosscut/models/human_segmentation_pphumanseg_2023mar.onnx"
          test -f "${engine_source}/crosscut/models/LICENSE.opencv-zoo-mediapipe-pose"
          test -f "${engine_source}/crosscut/models/LICENSE.opencv-zoo-pphumanseg"
          test -f "${engine_source}/crosscut/models/PROVENANCE.pose.md"

          /bin/rm -rf "${engine_destination}"
          /bin/mkdir -p "${engine_destination}/crosscut"
          /bin/cp "${engine_source}/crosscut_cli.py" "${engine_destination}/crosscut_cli.py"
          /bin/cp "${engine_source}/crosscut/"*.py "${engine_destination}/crosscut/"
          /bin/cp -R "${engine_source}/crosscut/models" "${engine_destination}/crosscut/"

  CrossCutMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CrossCutMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.luna021839.crosscut.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CrossCutMac:
    build:
      targets:
        CrossCutMac: all
        CrossCutMacTests: [test]
    test:
      targets:
        - CrossCutMacTests
