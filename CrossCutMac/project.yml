name: CrossCutMac

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES

targets:
  CrossCutMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.luna021839.crosscut
        PRODUCT_NAME: CrossCutMac
        PRODUCT_MODULE_NAME: CrossCutMac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "CrossCut"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.video"
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          COPY_PHASE_STRIP: YES
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: debugging
    postBuildScripts:
      - name: Bundle Python Engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          /usr/bin/python3 "${SRCROOT}/../tools/bundle_engine.py" \
            --source "${SRCROOT}/../engine" \
            --destination "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/engine" \
            --build-root "${TARGET_BUILD_DIR}"

  CrossCutMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: CrossCutMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.luna021839.crosscut.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CrossCutMac:
    build:
      targets:
        CrossCutMac: all
        CrossCutMacTests: [test]
    test:
      targets:
        - CrossCutMacTests
